services:
  - type: web
    name: pokhrelflexprinting-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    # The server imports the ESM React-Email .jsx templates at runtime, so it
    # MUST run under tsx (npm start → "tsx server.js"), not plain node.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5300
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: pfp-images
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      # Email is sent through Resend (see services/emailService.js).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: CORS_ORIGINS
        sync: false
